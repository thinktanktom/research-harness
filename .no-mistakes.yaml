# no-mistakes validation gate — research-harness
# Personal repo (origin: git@github.com:thinktanktom/research-harness.git).
# Config is honored only from the trusted default branch (main) at a pinned SHA.

# Drive the locally-authenticated `claude` CLI for the review/intent/document stages.
# No ANTHROPIC_API_KEY — cost is subscription quota, not API dollars.
agent: claude

# All commands run via `sh -c` from the repo root inside the gate's worktree.
commands:
  # Dependency prep — the gate worktree is a fresh checkout with no node_modules.
  prepare: "npm ci --no-audit --no-fund"
  # Node's built-in test runner over the TS sources via the tsx loader.
  test: "npm test"
  # Real typecheck using the typescript devDependency already in the repo.
  # --allowImportingTsExtensions: the *.test.ts files import ./foo.ts with an
  # explicit extension (required by the node --import tsx test runner); this
  # flag lets tsc accept those specifiers under --noEmit.
  lint: "npx --no-install tsc --noEmit --allowImportingTsExtensions"
  # No formatter in this repo; `format` intentionally left unset.

# Do not let the agent silently rewrite tests or code to get past a stage.
# A failing test or a blocking review finding parks for a human decision
# instead of being auto-patched.
auto_fix:
  review: 0
  test: 0

# Keep AI review scoped to the diff.
review:
  path_instructions:
    - path: "src/**"
      instructions: >
        TypeScript ESM project. Review only the changed lines in the diff.
        Do not request new test coverage for code that was not touched.

# Paths the gate must not modify without an explicit operator override.
protected_paths:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"

# Paths the gate should not treat as project changes.
ignore_patterns:
  - "reports/**"
  - ".lavish/**"
